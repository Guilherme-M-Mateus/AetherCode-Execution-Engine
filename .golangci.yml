version: "2"

# golangci-lint v2 configuration.
# Keep the linter set credible but not noisy: this engine deliberately runs
# untrusted user code and has fail-open error paths, so a few security/error
# linters are tuned down rather than fighting the design.
linters:
  enable:
    - errcheck
    - govet
    - staticcheck # gosimple checks are folded into staticcheck in golangci-lint v2
    - unused
    - ineffassign
    - bodyclose
    - gosec
    - misspell     # catches typos in comments and strings
    - whitespace   # trailing whitespace / unnecessary blank lines
  settings:
    errcheck:
      # Logging is intentionally fire-and-forget.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Println
        - fmt.Printf
        - fmt.Sprintf
    gosec:
      excludes:
        - G104 # unchecked errors — handled by errcheck, and fail-open is by design
  exclusions:
    generated: lax
    # The load generator is a throwaway benchmarking tool: it uses a fast
    # non-crypto PRNG and ignores stdout encode errors on purpose, so we don't
    # hold it to the production linters.
    rules:
      - path: cmd/loadgen
        linters:
          - gosec
          - errcheck

# In golangci-lint v2, gofmt and goimports are formatters, not linters.
# `golangci-lint run` still reports unformatted files; `golangci-lint fmt` fixes them.
formatters:
  enable:
    - goimports # enforces canonical import grouping (stdlib / external / internal)
    - gofmt     # enforces gofmt -s — no manual whitespace debates
  settings:
    gofmt:
      simplify: true
    goimports:
      # Group imports: stdlib first, then external packages, then internal.
      local-prefixes:
        - github.com/stjosephsplacements/AetherCode-Execution-Engine
