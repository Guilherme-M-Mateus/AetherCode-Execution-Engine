name: Bug Report
description: Report a reproducible bug in the execution engine
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities** must be reported privately. See [SECURITY.md](../SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a curl command that reproduces the issue.
      placeholder: |
        1. POST /api/v1/execute with body ...
        2. GET /api/v1/stream?job_id=...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant structured log output (`AC_LOG_FORMAT=text` for readability).
      render: text

  - type: input
    id: version
    attributes:
      label: Engine version / commit
      placeholder: "v0.3.0 or commit SHA"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment type
      options:
        - docker compose (dev)
        - systemd (production)
        - Kubernetes
        - Other
    validations:
      required: true
