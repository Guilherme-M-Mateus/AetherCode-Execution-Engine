name: stale

# Keeps the issue tracker clean: marks inactive issues stale, closes them
# if there's no response, and also closes stale PRs.

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: >
            This issue has been inactive for 60 days. It will be closed in 14 days
            unless there is further activity. If this is still relevant, please
            leave a comment.
          close-issue-message: >
            Closing due to inactivity. Please reopen if this is still relevant.
          exempt-issue-labels: "pinned,security,bug,roadmap"

          # Pull Requests
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: "stale"
          stale-pr-message: >
            This PR has been inactive for 30 days. It will be closed in 7 days
            unless there is further activity.
          close-pr-message: >
            Closing due to inactivity. Please reopen when ready to land.
          exempt-pr-labels: "security,do-not-close"
