name: dependabot-approver

# Satisfies branch-protection required-review rules for Dependabot PRs on both
# development and production.
#
# When a Dependabot PR opens, this workflow:
#   1. Waits for CI to go green.
#   2. Posts an approving review (the GITHUB_TOKEN actor is distinct from the
#      dependabot author, so it counts as a required approval).
#   3. Enables auto-merge so GitHub closes the PR the moment all checks pass.
#
# PRs by anyone other than dependabot[bot] are never touched.

on:
  pull_request:
    branches: [development, production]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  approve:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Wait for CI, then approve + enable auto-merge
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"
          REPO="${GITHUB_REPOSITORY}"

          echo "Waiting for CI on Dependabot PR #${PR} (target: ${{ github.event.pull_request.base.ref }}) ..."

          for i in $(seq 1 90); do
            out="$(gh pr checks "$PR" --repo "$REPO" 2>/dev/null || true)"
            pending="$(printf '%s\n' "$out" | grep -cE 'pending|in_progress|queued' || true)"
            failed="$(printf '%s\n'  "$out" | grep -cE '\bfail\b'                  || true)"
            echo "[wait ${i}/90] pending=${pending:-0} failed=${failed:-0}"

            if [ -n "$out" ] && [ "${pending:-1}" = "0" ]; then
              if [ "${failed:-0}" != "0" ]; then
                echo "CI red — leaving PR #${PR} for a human"
                exit 0
              fi
              break
            fi
            sleep 20
          done

          echo "CI green — approving PR #${PR}"
          gh pr review "$PR" --repo "$REPO" --approve \
            --body "✅ Auto-approved Dependabot dependency update; all CI checks passed."

          echo "Enabling auto-merge on PR #${PR}"
          gh pr merge "$PR" --repo "$REPO" --auto --squash \
            || echo "auto-merge flag already set"

          echo "Done — PR #${PR} will close once GitHub satisfies all branch-protection rules."
