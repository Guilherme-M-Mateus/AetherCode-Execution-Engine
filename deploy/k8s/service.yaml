apiVersion: v1
kind: Service
metadata:
  name: aethercode-exec-svc
  namespace: aethercode
  labels:
    app.kubernetes.io/name: aethercode-exec
spec:
  selector:
    app.kubernetes.io/name: aethercode-exec
  ports:
    - name: http
      port: 5100
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 6060
      targetPort: metrics
      protocol: TCP
  type: ClusterIP
