apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aethercode-exec-hpa
  namespace: aethercode
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aethercode-exec
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120  # don't scale down while jobs may still be draining
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
